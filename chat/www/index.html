<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e0e12">
  <title>Codex 随身</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">C</div>
        <div class="brand-text">
          <h1>Codex 随身</h1>
          <span id="modelBadge" class="badge">未配置</span>
        </div>
      </div>
      <div class="actions">
        <button id="clearBtn" class="icon-btn" title="清空对话" aria-label="清空对话" data-lucide="trash-2"></button>
        <button id="settingsBtn" class="icon-btn" title="设置" aria-label="设置" data-lucide="settings"></button>
      </div>
    </header>

    <main id="chat" class="chat">
      <div id="emptyState" class="empty-state">
        <div class="empty-orb" aria-hidden="true"><span data-lucide="sparkles"></span></div>
        <h2>和 Codex 对话</h2>
        <p>通过 OpenAI API 直连，在手机上随时向 Codex 提问。消息会流式输出。</p>
        <div id="emptyCta" class="empty-cta"></div>
      </div>
      <div id="messages" class="messages"></div>
    </main>

    <footer class="composer">
      <div class="composer-card">
        <textarea id="input" rows="1" placeholder="输入消息…" enterkeyhint="send" autocomplete="off"></textarea>
        <div class="composer-actions">
          <button id="stopBtn" class="send-btn stop-btn hidden" title="停止生成" aria-label="停止生成" data-lucide="square"></button>
          <button id="sendBtn" class="send-btn" title="发送" aria-label="发送" data-lucide="arrow-up"></button>
        </div>
      </div>
      <p class="composer-note">由你提供 API Key · 仅存储在本机</p>
    </footer>
  </div>

  <div id="settings" class="modal hidden" role="dialog" aria-modal="true" aria-label="设置">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-sheet">
      <header class="sheet-head">
        <h2>设置</h2>
        <button id="closeSettings" class="icon-btn" title="关闭" aria-label="关闭" data-lucide="x"></button>
      </header>
      <div class="sheet-body">
        <label class="field">
          <span class="field-label">API Key</span>
          <div class="key-row">
            <input id="apiKey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
            <button id="toggleKey" class="icon-btn" title="显示/隐藏" aria-label="显示/隐藏密钥" data-lucide="eye"></button>
          </div>
        </label>

        <label class="field">
          <span class="field-label">模型</span>
          <div id="modelChips" class="chips"></div>
          <input id="model" type="text" list="modelOptions" spellcheck="false" autocomplete="off">
          <datalist id="modelOptions"></datalist>
        </label>

        <label class="field">
          <span class="field-label">系统提示词（可选）</span>
          <textarea id="systemPrompt" rows="3" placeholder="例如：你是我的随身编程助手，用中文回答。"></textarea>
        </label>

        <div id="testResult" class="test-result hidden"></div>

        <div class="sheet-actions">
          <button id="testBtn" class="btn secondary">连接测试</button>
          <button id="saveBtn" class="btn primary">保存</button>
        </div>
        <p class="privacy-note">API Key 仅保存在这台手机本地，用于直接调用 OpenAI API，不会上传到任何其他服务器。</p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/lucide.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
